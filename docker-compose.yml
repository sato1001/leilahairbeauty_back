services:
  postgres:
    image: postgres:16-alpine
    container_name: salao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salao_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salao_password}
      POSTGRES_DB: ${POSTGRES_DB:-salao_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - salao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salao_user} -d ${POSTGRES_DB:-salao_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  salao_pgdata:
    name: salao_pgdata

